<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060d1c">
  <meta name="description" content="PAGOAR sin cámara: las 4 etapas sobre sistemas de pago virtual con preguntas y resultado.">
  <title>PAGOAR — Versión sin AR · Sistemas de Pago Virtual</title>
  <link rel="icon" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">
  <link rel="stylesheet" href="assets/css/pagoar.css">
  <style>
    body { min-height: 100vh; min-height: 100dvh; background: radial-gradient(120% 60% at 50% 0%, #133a6b 0%, #0a1a35 45%, var(--bg) 80%) fixed; }
    .topbar { position: sticky; background: linear-gradient(180deg, rgba(6,13,28,.96), rgba(6,13,28,.75)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .wrap { width: min(1040px, 100%); margin: 0 auto; padding: 8px 14px calc(26px + var(--safe-bottom)); }
    .intro { text-align: center; margin: 6px 0 12px; }
    .tag { display: inline-block; font-size: 12px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase; color: #04101f; background: var(--yellow); padding: 4px 10px; border-radius: 999px; }
    .intro h1 { font-size: 22px; line-height: 1.2; margin: 8px 0 4px; }
    .intro p { margin: 0; color: var(--muted); font-size: 14.5px; }
    .grid { display: grid; gap: 14px; align-items: start; }
    /* El holograma animado (mismo motor que la AR) sobre un "proyector" de luz tenue */
    .holo { position: relative; margin: 0; display: flex; justify-content: center; }
    .holo::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -6px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,225,255,.35), transparent); filter: blur(4px); pointer-events: none; }
    .holo canvas { width: min(100%, 420px); height: auto; aspect-ratio: 4 / 5; display: block; touch-action: pan-y; }
    .volver { text-align: center; margin: 16px 0 0; font-size: 14.5px; color: var(--muted); }
    .volver a { font-weight: 800; }
    @media (min-width: 860px) {
      .grid { grid-template-columns: 400px 1fr; gap: 26px; margin-top: 10px; }
      .holo { position: sticky; top: 80px; }
      .holo canvas { width: 100%; }
      .intro h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" style="color:inherit;text-decoration:none"><img src="assets/app-icon.png" alt="" width="28" height="28">PAGO<b>AR</b></a>
    <button class="pill" type="button" data-fuentes>Fuentes</button>
  </header>

  <main class="wrap">
    <div class="intro">
      <span class="tag">Versión sin AR</span>
      <h1>Misión: Sistemas de Pago Virtual</h1>
      <p>Mismas 4 etapas y preguntas que la experiencia AR, sin usar la cámara.</p>
    </div>

    <div class="grid">
      <figure class="holo">
        <canvas id="holo" width="800" height="1000" role="img" aria-label="Esquema de la etapa actual"></canvas>
      </figure>
      <section id="mision" class="mision glass" aria-label="Misión"></section>
    </div>

    <p class="volver">¿Tu cámara ya funciona? <a href="index.html">Probar la experiencia con AR</a></p>
  </main>

  <noscript><p style="text-align:center;padding:20px">Esta actividad necesita JavaScript activado.</p></noscript>

  <script src="assets/js/contenido.js"></script>
  <script src="assets/js/mision.js"></script>
  <script src="assets/js/holo.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('holo');
      var raiz = document.getElementById('mision');
      var holo = window.PagoarHolo.crear();           // misma línea de tiempo que la experiencia AR
      var ahora = function () { return performance.now() / 1000; };
      var previo = null;
      var mision = window.PagoarMision.crear({
        raiz: raiz,
        onCambio: function (estado) {
          if (!estado.nuevaVista) { // se respondió: destello verde/rojo del holograma
            if (previo) holo.destello(estado.aciertos > previo.aciertos ? 'verde' : 'rojo', ahora());
            previo = estado; holo.setEstado(estado, ahora()); return;
          }
          var cambioEtapa = previo && (previo.etapa !== estado.etapa || (previo.fase === 'final') !== (estado.fase === 'final'));
          holo.setEstado(estado, ahora());
          canvas.setAttribute('aria-label', estado.fase === 'final'
            ? 'Misión completada: ' + estado.aciertos + ' de ' + estado.total + ' respuestas correctas'
            : 'Esquema animado de la etapa ' + (estado.etapa + 1) + ' de ' + estado.total);
          // En teléfono: al cambiar de etapa mostramos el nuevo holograma; al pasar a la pregunta, el panel.
          if (previo && window.matchMedia('(max-width: 859px)').matches) {
            var destino = cambioEtapa ? canvas : raiz;
            var y = destino.getBoundingClientRect().top + window.scrollY - 70;
            if (cambioEtapa || window.scrollY > y) window.scrollTo({ top: Math.max(0, y), behavior: window.PagoarHolo.REDUCIDO ? 'auto' : 'smooth' });
          }
          previo = estado;
        }
      });
      mision.render(true);
      holo.intro(ahora());                             // escaneo → "sistema de pago detectado" → PAGOAR
      window.PagoarHolo.montar2D(canvas, holo);
      [].forEach.call(document.querySelectorAll('[data-fuentes]'), function (b) { b.addEventListener('click', window.PagoarMision.abrirFuentes); });
    })();
  </script>
</body>
</html>
